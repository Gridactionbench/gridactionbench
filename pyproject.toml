[project]
name = "gridactionbench"
version = "0.2.0"
description = "An open benchmark for evaluating AI actions in energy systems."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.14.2,<3.0",
    "PyYAML>=6.0.3",
    "typer>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[dependency-groups]
quality = ["build>=1.2", "pip-audit>=2.10.1", "setuptools>=78.1.1"]

[project.scripts]
gridactionbench = "gridactionbench.cli:app"

[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gridactionbench*", "baselines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "docker: opt-in checks against a real Docker daemon",
    "psse: opt-in checks against a licensed PSS/E installation",
]
